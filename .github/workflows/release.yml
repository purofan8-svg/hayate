name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin hayate --bin hayate-setup

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "dev" }
          ./tools/package.ps1 -Version $v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hayate-windows
          path: dist/*.zip
