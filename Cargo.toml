[package]
name = "hayate"
version = "0.1.0"
edition = "2024"
description = "Instant file search for Windows and Linux"
license = "MIT"

[[bin]]
name = "hayate"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
jwalk = "0.8"
memchr = "2"
ratatui = "0.29"
rayon = "1"